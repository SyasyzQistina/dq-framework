<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Data Quality Framework</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f3; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 16px; padding: 3rem;
          max-width: 520px; width: 100%; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
  .logo { background: #2166AC; color: #fff; width: 56px; height: 56px;
          border-radius: 14px; display: flex; align-items: center;
          justify-content: center; font-size: 1.6rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; font-weight: 600; color: #111; margin-bottom: .5rem; }
  p  { color: #666; font-size: .95rem; margin-bottom: 2rem; line-height: 1.6; }
  .upload-area { border: 2px dashed #d0d0cc; border-radius: 10px;
                 padding: 2rem; text-align: center; margin-bottom: 1.5rem;
                 cursor: pointer; transition: border-color .2s; }
  .upload-area:hover { border-color: #2166AC; }
  .upload-area input { display: none; }
  .upload-area label { cursor: pointer; }
  .upload-icon { font-size: 2.5rem; margin-bottom: .5rem; }
  .upload-text { color: #555; font-size: .9rem; }
  .upload-text span { color: #2166AC; font-weight: 600; }
  #filename { margin-top: .5rem; font-size: .85rem; color: #2166AC; font-weight: 500; }
  button { background: #2166AC; color: #fff; border: none; border-radius: 8px;
           padding: .85rem 2rem; font-size: 1rem; font-weight: 600;
           width: 100%; cursor: pointer; transition: background .2s; }
  button:hover { background: #0F6E56; }
  .dims { display: grid; grid-template-columns: repeat(4, 1fr);
          gap: .5rem; margin-bottom: 2rem; }
  .dim { background: #f0fdf8; border-radius: 8px; padding: .6rem;
         text-align: center; font-size: .75rem; color: #0F6E56; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
    {% if error %}
  <div style="background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;
              padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.9rem;">
    {{ error }}
  </div>
  {% endif %}
  <div class="logo">📊</div>
  <h1>Data Quality Framework</h1>
  <p>Upload any CSV dataset to automatically assess its quality across
     four dimensions and generate a visual report.</p>

  <div class="dims">
    <div class="dim">Completeness</div>
    <div class="dim">Uniqueness</div>
    <div class="dim">Validity</div>
    <div class="dim">Consistency</div>
  </div>

  <form action="/analyse" method="POST" enctype="multipart/form-data">
    <div class="upload-area" id="drop-area">
    <input type="file" id="file" name="file" accept=".csv,.xlsx,.json" style="display:none"/>
    <label for="file" style="cursor:pointer; display:block; width:100%;">
      <div class="upload-icon">📁</div>
      <div class="upload-text">
        <span>Click to upload</span> or drag and drop<br/>
        CSV, Excel or JSON
      </div>
      <div id="filename"></div>
    </label>
  </div>

  <script>
    const input = document.getElementById('file');
    const filename = document.getElementById('filename');
    const dropArea = document.getElementById('drop-area');

    input.addEventListener('change', () => {
      if (input.files.length > 0) {
        filename.textContent = '✅ ' + input.files[0].name;
        dropArea.style.borderColor = '#2166AC';
        dropArea.style.background = '#f0fdf8';
      }
    });

    // Drag and drop support
    dropArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropArea.style.borderColor = '#2166AC';
    });

    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        input.files = files;
        filename.textContent = '✅ ' + files[0].name;
        dropArea.style.borderColor = '#2166AC';
        dropArea.style.background = '#f0fdf8';
      }
    });
  </script>
    <button type="submit" id="submit-btn" onclick="showLoading()">
      Analyse Dataset
    </button>

    <div id="loading" style="display:none; text-align:center; margin-top:1.5rem;">
      <div style="display:inline-block; width:36px; height:36px; border:4px solid #e0e0e0;
                  border-top-color:#2166AC; border-radius:50%;
                  animation:spin 0.8s linear infinite;"></div>
      <p style="margin-top:.8rem; color:#555; font-size:.9rem;">
        Analysing your dataset — this may take a few seconds...
      </p>
    </div>

    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script>
      function showLoading() {
        const file = document.getElementById('file').files[0];
        if (!file) return;
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
      }
    </script>
  </form>
</div>
</body>
</html>
